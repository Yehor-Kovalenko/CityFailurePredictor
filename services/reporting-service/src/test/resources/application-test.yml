spring:
  main:
    banner-mode: off

  config:
    import: ""

  datasource:
    # H2 has no TIMESTAMPTZ type used by the Postgres migrations, so alias it
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE DOMAIN IF NOT EXISTS TIMESTAMPTZ AS TIMESTAMP WITH TIME ZONE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none

  cloud:
    config:
      enabled: false
    discovery:
      enabled: false

logging:
  config: classpath:logback-test.xml

eureka:
  client:
    enabled: false
