server:
  port: 9191

spring:
  application:
    name: api-gateway

  config:
    label: main
    import: "optional:configserver:http://config-server:8888"

  cloud:
    gateway:
      default-filters:
        - PreserveHostHeader
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**,/oauth2/**,/login/**,/login/oauth2/**

        - id: incident-service
          uri: lb://incident-service
          predicates:
            - Path=/incident/**, /incidents/**, /incident-service/**

        - id: data-ingestion-service
          uri: lb://data-ingestion-service
          predicates:
            - Path=/data-ingestion/**, /data-ingestion-service/**

eureka:
  instance:
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: http://service-registry:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    org.springframework.cloud.gateway: INFO
  config: classpath:logback-spring.xml

springdoc:
  swagger-ui:
    urls-primary-name: api-gateway
    config-url: /swagger-config