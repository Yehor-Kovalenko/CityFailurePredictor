x-mtls-environment: &mtls-environment
  SPRING_PROFILES_ACTIVE: mtls
  SPRING_CONFIG_ADDITIONAL_LOCATION: optional:file:/etc/cfp/tls/
  TLS_CERTS_DIR: /etc/cfp/certs
  MANAGEMENT_PORT: 8081

services:

  # --- Infrastructure ---

  certs-init:
    image: eclipse-temurin:21-jre
    container_name: certs-init
    entrypoint: [ "/bin/sh", "/opt/cfp/generate-certs.sh" ]
    environment:
      TLS_SERVICES: >-
        api-gateway auth-service incident-service data-ingestion-service
        decision-service reporting-service notification-service
      TLS_KEYSTORE_PASSWORD: ${TLS_KEYSTORE_PASSWORD:-changeit}
    volumes:
      - ./security/tls/generate-certs.sh:/opt/cfp/generate-certs.sh:ro
      - tls-ca:/ca
      - tls-certs:/certs
    restart: "no"

  service-registry:
    container_name: service-registry
    build:
      context: .
      dockerfile: services/service-registry/Dockerfile
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: always

  config-server:
    container_name: config-server
    build:
      context: .
      dockerfile: services/config-server/Dockerfile
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
    depends_on:
      service-registry:
        condition: service_healthy
    volumes:
      - ~/.ssh:/root/.ssh:ro
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8888/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: always

  api-gateway:
    container_name: api-gateway
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "9191:9191"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
      LOG_FILE: /var/log/services/api-gateway.log
      SPRING_PROFILES_ACTIVE: mtls-gateway
      SPRING_CONFIG_ADDITIONAL_LOCATION: optional:file:/etc/cfp/tls/
      TLS_CERTS_DIR: /etc/cfp/certs
      TLS_KEYSTORE_PASSWORD: ${TLS_KEYSTORE_PASSWORD:-changeit}
    depends_on:
      certs-init:
        condition: service_completed_successfully
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy
    volumes:
      - log-volume:/var/log/services
      - ./security/tls/config:/etc/cfp/tls:ro
      - tls-certs:/etc/cfp/certs:ro
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9191/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: always


  # --- Apache Kafka ---

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    healthcheck:
      test: [ "CMD", "bash", "-c", "echo > /dev/tcp/localhost/9092" ]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy


  # --- Databases ---

  postgres-auth:
    image: postgres:15
    container_name: postgres-auth
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d auth_db" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

  postgres-incidents:
    image: postgres:15
    container_name: postgres-incidents
    environment:
      POSTGRES_DB: incidents_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_incidents_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d incidents_db" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

  postgres-decision:
    image: postgres:15
    container_name: postgres-decision
    environment:
      POSTGRES_DB: decision_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_decision_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d decision_db" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

  postgres-reporting:
    image: postgres:15
    container_name: postgres-reporting
    environment:
      POSTGRES_DB: reporting_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_reporting_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d reporting_db" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

  postgres-notifications:
    image: postgres:15
    container_name: postgres-notifications
    environment:
      POSTGRES_DB: notifications_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_notifications_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d notifications_db" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

  timescaledb-ingestion:
    image: timescale/timescaledb:latest-pg15
    container_name: timescaledb-ingestion
    environment:
      POSTGRES_DB: ingestion_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - timescaledb_ingestion_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d ingestion_db" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

  redis:
    image: redis:7
    container_name: redis
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always


  # --- Services ---

  auth-service:
    container_name: auth-service
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
      LOG_FILE: /var/log/services/auth-service.log
      <<: *mtls-environment
      AUTH_ADMIN_EMAILS: lupelikan@gmail.com
    depends_on:
      certs-init:
        condition: service_completed_successfully
      postgres-auth:
        condition: service_healthy
      config-server:
        condition: service_healthy
    volumes:
      - log-volume:/var/log/services
      - ./security/tls/config:/etc/cfp/tls:ro
      - tls-certs:/etc/cfp/certs:ro
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: always

  incident-service:
    container_name: incident-service
    build:
      context: .
      dockerfile: services/incident-service/Dockerfile
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
      LOG_FILE: /var/log/services/incident-service.log
      <<: *mtls-environment
    #      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    depends_on:
      certs-init:
        condition: service_completed_successfully
      postgres-incidents:
        condition: service_healthy
      config-server:
        condition: service_healthy
    volumes:
      - log-volume:/var/log/services
      - ./security/tls/config:/etc/cfp/tls:ro
      - tls-certs:/etc/cfp/certs:ro
    restart: always

  data-ingestion-service:
    container_name: data-ingestion-service
    build:
      context: .
      dockerfile: services/data-ingestion-service/Dockerfile
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
      LOG_FILE: /var/log/services/data-ingestion-service.log
      <<: *mtls-environment
      DATASET_PATH: /data/low-carbon-london
    depends_on:
      certs-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      timescaledb-ingestion:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - log-volume:/var/log/services
      - ./security/tls/config:/etc/cfp/tls:ro
      - tls-certs:/etc/cfp/certs:ro
      - ./datasets/low-carbon-london:/data/low-carbon-london:ro
      - ./datasets/sample:/data/sample:ro
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: always

  ai-service:
    container_name: ai-service
    build:
      context: .
      dockerfile: AI/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: always

  decision-service:
    container_name: decision-service
    build:
      context: .
      dockerfile: services/decision-service/Dockerfile
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
      LOG_FILE: /var/log/services/decision-service.log
      <<: *mtls-environment
    depends_on:
      certs-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      postgres-decision:
        condition: service_healthy
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    volumes:
      - log-volume:/var/log/services
      - ./security/tls/config:/etc/cfp/tls:ro
      - tls-certs:/etc/cfp/certs:ro
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: always

  reporting-service:
    container_name: reporting-service
    build:
      context: .
      dockerfile: services/reporting-service/Dockerfile
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
      LOG_FILE: /var/log/services/reporting-service.log
      <<: *mtls-environment
    depends_on:
      certs-init:
        condition: service_completed_successfully
      postgres-reporting:
        condition: service_healthy
      redis:
        condition: service_healthy
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      incident-service:
        condition: service_started
      decision-service:
        condition: service_started
    volumes:
      - log-volume:/var/log/services
      - ./security/tls/config:/etc/cfp/tls:ro
      - tls-certs:/etc/cfp/certs:ro
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: always

  notification-service:
    container_name: notification-service
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
      LOG_FILE: /var/log/services/notification-service.log
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:alerts@city-failure-predictor.example}
      <<: *mtls-environment
    depends_on:
      certs-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      postgres-notifications:
        condition: service_healthy
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    volumes:
      - log-volume:/var/log/services
      - ./security/tls/config:/etc/cfp/tls:ro
      - tls-certs:/etc/cfp/certs:ro
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: always


  # --- Frontend ---

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:9191
    ports:
      - "3000:80"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: unless-stopped

  # --- Monitoring  ---

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    restart: unless-stopped

  # --- Logging ---
  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    volumes:
      - ./logging/config.alloy:/etc/alloy/config.alloy:ro
      - log-volume:/var/log/services:ro
    command: run /etc/alloy/config.alloy
    depends_on:
      - loki

  loki:
    image: grafana/loki:latest
    container_name: loki
    volumes:
      - ./logging/loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3100/ready || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki

  postgres-exporter-auth:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter-auth
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@postgres-auth:5432/auth_db?sslmode=disable"
    depends_on:
      postgres-auth:
        condition: service_healthy
    restart: unless-stopped

  postgres-exporter-incidents:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter-incidents
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@postgres-incidents:5432/incidents_db?sslmode=disable"
    depends_on:
      postgres-incidents:
        condition: service_healthy
    restart: unless-stopped

  postgres-exporter-decision:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter-decision
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@postgres-decision:5432/decision_db?sslmode=disable"
    depends_on:
      postgres-decision:
        condition: service_healthy
    restart: unless-stopped

  postgres-exporter-reporting:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter-reporting
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@postgres-reporting:5432/reporting_db?sslmode=disable"
    depends_on:
      postgres-reporting:
        condition: service_healthy
    restart: unless-stopped

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: kafka-exporter
    command:
      - "--kafka.server=kafka:9092"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped


volumes:
  postgres_auth_data:
  postgres_incidents_data:
  postgres_decision_data:
  postgres_reporting_data:
  postgres_notifications_data:
  timescaledb_ingestion_data:
  grafana_data:
  log-volume:
  loki-data:
  tls-ca:
  tls-certs:
