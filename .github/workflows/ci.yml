name: CI

# Trunk-based flow with short-lived feature branches merged to `main` via pull request:
#  - pull_request -> fast feedback for the proposed change (only affected components are built/tested)
#  - push to main -> full re-validation of the actually merged code; this is the run that later
#                    stages (image build & publish) build on, so artifacts always come from a green `main`
#  - workflow_dispatch -> manual full run
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR runs are cancelled to save runner time; runs on `main` are never cancelled,
# so every merged commit gets its own complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.backend == 'true' }}
      ai: ${{ github.event_name != 'pull_request' || steps.filter.outputs.ai == 'true' }}
      frontend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'pom.xml'
              - 'mvnw'
              - '.mvn/**'
              - 'services/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/jacoco-summary.sh'
            ai:
              - 'AI/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/scripts/vitest-coverage-summary.mjs'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend (Java) - build & test
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # -fae: keep building independent modules after a failure so the report lists every failing test;
      # the step (and the job) still fails if any test fails.
      - name: Build, test and measure coverage
        run: ./mvnw -B --no-transfer-progress -fae verify

      - name: Publish test report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v5
        with:
          check_name: Backend test report
          report_paths: 'services/*/target/surefire-reports/TEST-*.xml'
          detailed_summary: true
          include_passed: true
          require_tests: true

      - name: Add coverage summary
        if: ${{ !cancelled() }}
        run: .github/scripts/jacoco-summary.sh >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            services/*/target/surefire-reports/*.xml
            services/*/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

  ai:
    name: AI service (Python) - test
    needs: changes
    if: needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            AI/requirements.txt
            AI/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r AI/requirements-dev.txt

      - name: Run tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >
          pytest AI/Tests
          --junitxml=AI/test-results/junit.xml
          --cov --cov-config=AI/.coveragerc
          --cov-report=xml:AI/test-results/coverage.xml
          --cov-report=term

      - name: Publish test report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v5
        with:
          check_name: AI test report
          report_paths: AI/test-results/junit.xml
          detailed_summary: true
          include_passed: true
          require_tests: true

      - name: Add coverage summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### AI service code coverage (pytest-cov)"
            echo
            coverage report --rcfile=AI/.coveragerc --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-test-reports
          path: AI/test-results/
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend - lint, test & build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Publish test report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v5
        with:
          check_name: Frontend test report
          report_paths: frontend/test-results/junit.xml
          detailed_summary: true
          include_passed: true
          require_tests: true

      - name: Add coverage summary
        if: ${{ !cancelled() && hashFiles('frontend/coverage/coverage-summary.json') != '' }}
        run: node ../.github/scripts/vitest-coverage-summary.mjs coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-reports
          path: |
            frontend/test-results/
            frontend/coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Type check and build
        run: npm run build

  # ---------------------------------------------------------------
  # Obrazy, smoke test i obserwowalność całego systemu, publikacja (tylko push do main)
  # ---------------------------------------------------------------
  prepare:
    name: Prepare image names and version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, ai, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      owner: ${{ steps.meta.outputs.owner }}
      version: ${{ steps.meta.outputs.version }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      run_number: ${{ steps.meta.outputs.run_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from pom.xml and compute tags
        id: meta
        run: |
          VERSION="$(python3 -c "
          import xml.etree.ElementTree as ET
          root = ET.parse('pom.xml').getroot()
          print(root.find('{http://maven.apache.org/POM/4.0.0}version').text)")"
          {
            echo "owner=${GITHUB_REPOSITORY_OWNER,,}"
            echo "version=${VERSION}"
            echo "short_sha=${GITHUB_SHA::12}"
            echo "run_number=${GITHUB_RUN_NUMBER}"
          } >> "$GITHUB_OUTPUT"

  images:
    name: Build image - ${{ matrix.service }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: service-registry
            dockerfile: services/service-registry/Dockerfile
            context: .
          - service: config-server
            dockerfile: services/config-server/Dockerfile
            context: .
          - service: api-gateway
            dockerfile: services/api-gateway/Dockerfile
            context: .
          - service: auth-service
            dockerfile: services/auth-service/Dockerfile
            context: .
          - service: incident-service
            dockerfile: services/incident-service/Dockerfile
            context: .
          - service: data-ingestion-service
            dockerfile: services/data-ingestion-service/Dockerfile
            context: .
          - service: ai-service
            dockerfile: AI/Dockerfile
            context: .
          - service: decision-service
            dockerfile: services/decision-service/Dockerfile
            context: .
          - service: reporting-service
            dockerfile: services/reporting-service/Dockerfile
            context: .
          - service: notification-service
            dockerfile: services/notification-service/Dockerfile
            context: .
          - service: frontend
            dockerfile: frontend/Dockerfile
            context: frontend
            build_args: VITE_API_URL=http://localhost:9191

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Build and push (tag = commit SHA)"
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ needs.prepare.outputs.owner }}/${{ matrix.service }}:sha-${{ needs.prepare.outputs.short_sha }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  system-smoke:
    name: Smoke test - whole system
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [prepare, images]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull images built in this run
        run: |
          for s in service-registry config-server api-gateway auth-service incident-service \
                   data-ingestion-service ai-service decision-service reporting-service \
                   notification-service frontend; do
            docker pull "ghcr.io/${{ needs.prepare.outputs.owner }}/${s}:sha-${{ needs.prepare.outputs.short_sha }}"
          done

      # Config-server czyta prawdziwe repo konfiguracji przez deploy key.
      # Klucz trafia do ~/.ssh, bo docker-compose.yml montuje ~/.ssh do config-servera.
      - name: Prepare deploy key for config repo
        env:
          CONFIG_DEPLOY_KEY: ${{ secrets.CONFIG_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$CONFIG_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Prepare compose override and data directory
        run: |
          bash tests/ci/write-override.sh "${{ needs.prepare.outputs.owner }}" "sha-${{ needs.prepare.outputs.short_sha }}"
          mkdir -p datasets/low-carbon-london

      - name: Start system (docker compose, no build)
        run: |
          docker compose -f docker-compose.yml -f ci-override.yml up -d --no-build --wait --wait-timeout 420 \
            service-registry config-server api-gateway auth-service incident-service \
            data-ingestion-service ai-service decision-service reporting-service \
            notification-service frontend

      - name: Start observability stack
        run: docker compose -f docker-compose.yml -f ci-override.yml up -d --no-build prometheus loki alloy

      - name: System smoke test
        run: bash tests/ci/system-smoke.sh

      - name: Observability check (metrics and central logs)
        run: bash tests/ci/observability-check.sh

      - name: Upload observability report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: observability-report
          path: observability-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Collect logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f ci-override.yml ps -a > system-ps.txt 2>&1 || true
          docker compose -f docker-compose.yml -f ci-override.yml logs --no-color --tail 300 > system-logs.txt 2>&1 || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: system-smoke-logs
          path: |
            system-ps.txt
            system-logs.txt
          retention-days: 14

      - name: Stop system and remove deploy key
        if: always()
        run: |
          docker compose -f docker-compose.yml -f ci-override.yml down -v || true
          rm -f ~/.ssh/id_ed25519

  publish:
    name: Publish images with version tags
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [prepare, system-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Obrazy są już zbudowane i przetestowane (tag sha-*).
      # Dodajemy tylko tagi wersji, bez ponownego budowania.
      - name: Tag tested images with version and run number
        run: |
          OWNER="${{ needs.prepare.outputs.owner }}"
          SRC_TAG="sha-${{ needs.prepare.outputs.short_sha }}"
          VERSION="${{ needs.prepare.outputs.version }}"
          RUN="${{ needs.prepare.outputs.run_number }}"
          for s in service-registry config-server api-gateway auth-service incident-service \
                   data-ingestion-service ai-service decision-service reporting-service \
                   notification-service frontend; do
            SRC="ghcr.io/${OWNER}/${s}:${SRC_TAG}"
            docker buildx imagetools create \
              -t "ghcr.io/${OWNER}/${s}:${VERSION}-run${RUN}" \
              -t "ghcr.io/${OWNER}/${s}:latest" \
              "$SRC"
          done
  # Single, stable status check for branch protection ("CI result"). Component jobs skipped by the
  # path filter count as success; any failed or cancelled job fails this check and blocks the merge.
  ci-result:
    name: CI result
    needs: [ changes, backend, ai, frontend ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "::error::At least one CI job did not succeed"
              exit 1
            fi
          done
