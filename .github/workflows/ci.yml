name: CI

# Trunk-based flow with short-lived feature branches merged to `main` via pull request:
#  - pull_request -> fast feedback for the proposed change (only affected components are built/tested)
#  - push to main -> full re-validation of the actually merged code; this is the run that later
#                    stages (image build & publish) build on, so artifacts always come from a green `main`
#  - workflow_dispatch -> manual full run
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR runs are cancelled to save runner time; runs on `main` are never cancelled,
# so every merged commit gets its own complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.backend == 'true' }}
      ai: ${{ github.event_name != 'pull_request' || steps.filter.outputs.ai == 'true' }}
      frontend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'pom.xml'
              - 'mvnw'
              - '.mvn/**'
              - 'services/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/jacoco-summary.sh'
            ai:
              - 'AI/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/scripts/vitest-coverage-summary.mjs'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend (Java) - build & test
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # -fae: keep building independent modules after a failure so the report lists every failing test;
      # the step (and the job) still fails if any test fails.
      - name: Build, test and measure coverage
        run: ./mvnw -B --no-transfer-progress -fae verify

      - name: Publish test report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v5
        with:
          check_name: Backend test report
          report_paths: 'services/*/target/surefire-reports/TEST-*.xml'
          detailed_summary: true
          include_passed: true
          require_tests: true

      - name: Add coverage summary
        if: ${{ !cancelled() }}
        run: .github/scripts/jacoco-summary.sh >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            services/*/target/surefire-reports/*.xml
            services/*/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

  ai:
    name: AI service (Python) - test
    needs: changes
    if: needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            AI/requirements.txt
            AI/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r AI/requirements-dev.txt

      - name: Run tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >
          pytest AI/Tests
          --junitxml=AI/test-results/junit.xml
          --cov --cov-config=AI/.coveragerc
          --cov-report=xml:AI/test-results/coverage.xml
          --cov-report=term

      - name: Publish test report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v5
        with:
          check_name: AI test report
          report_paths: AI/test-results/junit.xml
          detailed_summary: true
          include_passed: true
          require_tests: true

      - name: Add coverage summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### AI service code coverage (pytest-cov)"
            echo
            coverage report --rcfile=AI/.coveragerc --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-test-reports
          path: AI/test-results/
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend - lint, test & build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Publish test report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v5
        with:
          check_name: Frontend test report
          report_paths: frontend/test-results/junit.xml
          detailed_summary: true
          include_passed: true
          require_tests: true

      - name: Add coverage summary
        if: ${{ !cancelled() && hashFiles('frontend/coverage/coverage-summary.json') != '' }}
        run: node ../.github/scripts/vitest-coverage-summary.mjs coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-reports
          path: |
            frontend/test-results/
            frontend/coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Type check and build
        run: npm run build

  # Single, stable status check for branch protection ("CI result"). Component jobs skipped by the
  # path filter count as success; any failed or cancelled job fails this check and blocks the merge.
  ci-result:
    name: CI result
    needs: [ changes, backend, ai, frontend ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "::error::At least one CI job did not succeed"
              exit 1
            fi
          done
