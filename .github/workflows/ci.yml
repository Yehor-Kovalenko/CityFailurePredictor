name: CI

# Trunk-based flow with short-lived feature branches merged to `main` via pull request:
#  - pull_request -> fast feedback for the proposed change (only affected components are built/tested)
#  - push to main -> full re-validation of the actually merged code; this is the run that later
#                    stages (image build & publish) build on, so artifacts always come from a green `main`
#  - workflow_dispatch -> manual full run
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR runs are cancelled to save runner time; runs on `main` are never cancelled,
# so every merged commit gets its own complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.backend == 'true' }}
      ai: ${{ github.event_name != 'pull_request' || steps.filter.outputs.ai == 'true' }}
      frontend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'pom.xml'
              - 'mvnw'
              - '.mvn/**'
              - 'services/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/jacoco-summary.sh'
            ai:
              - 'AI/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/scripts/vitest-coverage-summary.mjs'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend (Java) - build & test
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # -fae: keep building independent modules after a failure so the report lists every failing test;
      # the step (and the job) still fails if any test fails.
      - name: Build, test and measure coverage
        run: ./mvnw -B --no-transfer-progress -fae verify

      - name: Publish test report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v5
        with:
          check_name: Backend test report
          report_paths: 'services/*/target/surefire-reports/TEST-*.xml'
          detailed_summary: true
          include_passed: true
          require_tests: true

      - name: Add coverage summary
        if: ${{ !cancelled() }}
        run: .github/scripts/jacoco-summary.sh >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            services/*/target/surefire-reports/*.xml
            services/*/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

  ai:
    name: AI service (Python) - test
    needs: changes
    if: needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            AI/requirements.txt
            AI/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r AI/requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check AI --output-format=github

      - name: Run tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >
          pytest AI/Tests
          --junitxml=AI/test-results/junit.xml
          --cov --cov-config=AI/.coveragerc
          --cov-report=xml:AI/test-results/coverage.xml
          --cov-report=term

      - name: Publish test report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v5
        with:
          check_name: AI test report
          report_paths: AI/test-results/junit.xml
          detailed_summary: true
          include_passed: true
          require_tests: true

      - name: Add coverage summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### AI service code coverage (pytest-cov)"
            echo
            coverage report --rcfile=AI/.coveragerc --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-test-reports
          path: AI/test-results/
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend - lint, test & build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Publish test report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v5
        with:
          check_name: Frontend test report
          report_paths: frontend/test-results/junit.xml
          detailed_summary: true
          include_passed: true
          require_tests: true

      - name: Add coverage summary
        if: ${{ !cancelled() && hashFiles('frontend/coverage/coverage-summary.json') != '' }}
        run: node ../.github/scripts/vitest-coverage-summary.mjs coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-reports
          path: |
            frontend/test-results/
            frontend/coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Type check and build
        run: npm run build

  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan git history for secrets
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.28.0 git . \
            --no-banner --redact --exit-code 1 \
            --report-format json --report-path gitleaks-report.json

      - name: Add secret scan summary
        if: ${{ !cancelled() && hashFiles('gitleaks-report.json') != '' }}
        run: |
          {
            echo "### Secret scan (Gitleaks)"
            echo
            echo "**$(git rev-list --count HEAD)** commits scanned · **$(jq length gitleaks-report.json)** unaccepted findings"
            echo
            jq -r 'if length > 0 then
                     "| Rule | File | Line | Commit |\n|---|---|---:|---|\n" +
                     (map("| \(.RuleID) | `\(.File)` | \(.StartLine) | \(.Commit[0:12]) |") | join("\n"))
                   else ":white_check_mark: No secrets found" end' gitleaks-report.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload secret scan report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 7

  dockerfile-lint:
    name: Dockerfile lint (Hadolint)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint all Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          failure-threshold: warning

  supply-chain:
    name: Supply chain - SBOM, vulnerabilities & licenses
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: AI/requirements.txt

      - name: Generate SBOM - backend (Maven)
        run: |
          mkdir -p sbom reports
          ./mvnw -B --no-transfer-progress cyclonedx:makeAggregateBom
          cp target/bom.json sbom/backend.cdx.json

      - name: Generate SBOM - frontend (npm)
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npx --yes @cyclonedx/cyclonedx-npm@4.0.2 --omit dev \
            --output-format JSON --output-file ../sbom/frontend.cdx.json

      - name: Generate SBOM - AI service (pip)
        run: |
          python -m venv "$RUNNER_TEMP/ai-env"
          "$RUNNER_TEMP/ai-env/bin/pip" install --quiet -r AI/requirements.txt
          pip install --quiet cyclonedx-bom==7.1.0
          cyclonedx-py environment --output-format JSON -o sbom/ai-service.cdx.json "$RUNNER_TEMP/ai-env/bin/python"

      - name: License compliance gate
        run: |
          python3 .github/scripts/license-gate.py sbom/*.cdx.json \
            --policy .github/license-policy.json >> "$GITHUB_STEP_SUMMARY"

      - name: Install Grype
        id: grype
        if: ${{ !cancelled() }}
        uses: anchore/scan-action/download-grype@v6
        with:
          grype-version: v0.104.0

      - name: Scan SBOMs for known vulnerabilities
        id: scan
        if: ${{ !cancelled() && steps.grype.outcome == 'success' }}
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: |
          for component in backend frontend ai-service; do
            echo "::group::${component}"
            "$GRYPE" "sbom:sbom/${component}.cdx.json" --config .grype.yaml \
              -o table -o "json=reports/grype-${component}.json"
            echo "::endgroup::"
          done

      - name: Vulnerability risk gate (EPSS + CISA KEV)
        if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
        run: |
          python3 .github/scripts/vuln-gate.py reports/grype-*.json \
            --title "Dependency vulnerabilities" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SBOMs and scan reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-reports
          path: |
            sbom/
            reports/
          if-no-files-found: warn
          retention-days: 30
  # ---------------------------------------------------------------
  # Images, whole-system smoke test and observability, publishing (push to main only)
  # ---------------------------------------------------------------
  prepare:
    name: Prepare image names and version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, ai, frontend, secret-scan, dockerfile-lint, supply-chain]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      owner: ${{ steps.meta.outputs.owner }}
      version: ${{ steps.meta.outputs.version }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      run_number: ${{ steps.meta.outputs.run_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from pom.xml and compute tags
        id: meta
        run: |
          VERSION="$(python3 -c "
          import xml.etree.ElementTree as ET
          root = ET.parse('pom.xml').getroot()
          print(root.find('{http://maven.apache.org/POM/4.0.0}version').text)")"
          {
            echo "owner=${GITHUB_REPOSITORY_OWNER,,}"
            echo "version=${VERSION}"
            echo "short_sha=${GITHUB_SHA::12}"
            echo "run_number=${GITHUB_RUN_NUMBER}"
          } >> "$GITHUB_OUTPUT"

  images:
    name: Build image - ${{ matrix.service }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ needs.prepare.outputs.owner }}/${{ matrix.service }}:sha-${{ needs.prepare.outputs.short_sha }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: service-registry
            dockerfile: services/service-registry/Dockerfile
            context: .
          - service: config-server
            dockerfile: services/config-server/Dockerfile
            context: .
          - service: api-gateway
            dockerfile: services/api-gateway/Dockerfile
            context: .
          - service: auth-service
            dockerfile: services/auth-service/Dockerfile
            context: .
          - service: incident-service
            dockerfile: services/incident-service/Dockerfile
            context: .
          - service: data-ingestion-service
            dockerfile: services/data-ingestion-service/Dockerfile
            context: .
          - service: ai-service
            dockerfile: AI/Dockerfile
            context: .
          - service: decision-service
            dockerfile: services/decision-service/Dockerfile
            context: .
          - service: reporting-service
            dockerfile: services/reporting-service/Dockerfile
            context: .
          - service: notification-service
            dockerfile: services/notification-service/Dockerfile
            context: .
          - service: frontend
            dockerfile: frontend/Dockerfile
            context: frontend
            build_args: VITE_API_URL=http://localhost:9191

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Build image (tag = commit SHA)"
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ env.IMAGE }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Install Grype
        id: grype
        uses: anchore/scan-action/download-grype@v6
        with:
          grype-version: v0.104.0

      - name: Scan image for known vulnerabilities
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: |
          mkdir -p reports
          "$GRYPE" "docker:${IMAGE}" --config .grype.yaml \
            -o table -o "json=reports/grype-${{ matrix.service }}.json"

      - name: Vulnerability risk gate (EPSS + CISA KEV)
        run: |
          python3 .github/scripts/vuln-gate.py "reports/grype-${{ matrix.service }}.json" \
            --title "Image ${{ matrix.service }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload image scan report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: image-scan-${{ matrix.service }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Push image
        run: docker push "$IMAGE"

  system-smoke:
    name: Smoke test - whole system
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [prepare, images]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull images built in this run
        run: |
          for s in service-registry config-server api-gateway auth-service incident-service \
                   data-ingestion-service ai-service decision-service reporting-service \
                   notification-service frontend; do
            docker pull "ghcr.io/${{ needs.prepare.outputs.owner }}/${s}:sha-${{ needs.prepare.outputs.short_sha }}"
          done

      # Config-server reads the real configuration repo through a deploy key.
      # The key goes to ~/.ssh because docker-compose.yml mounts ~/.ssh into config-server.
      - name: Prepare deploy key for config repo
        env:
          CONFIG_DEPLOY_KEY: ${{ secrets.CONFIG_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$CONFIG_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Prepare compose override and data directory
        run: |
          bash tests/ci/write-override.sh "${{ needs.prepare.outputs.owner }}" "sha-${{ needs.prepare.outputs.short_sha }}"
          mkdir -p datasets/low-carbon-london

      - name: Start system (docker compose, no build)
        run: |
          docker compose -f docker-compose.yml -f ci-override.yml up -d --no-build --wait --wait-timeout 420 \
            service-registry config-server api-gateway auth-service incident-service \
            data-ingestion-service ai-service decision-service reporting-service \
            notification-service frontend

      - name: Start observability stack
        run: docker compose -f docker-compose.yml -f ci-override.yml up -d --no-build prometheus loki alloy

      - name: System smoke test
        run: bash tests/ci/system-smoke.sh

      - name: Observability check (metrics and central logs)
        run: bash tests/ci/observability-check.sh

      - name: Upload observability report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: observability-report
          path: observability-report/
          if-no-files-found: warn
          retention-days: 14

      # After the observability check, so the load test traffic does not skew its measurements
      - name: Load test (JMeter)
        run: bash tests/ci/load-test.sh

      - name: Upload load test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: load-test-report
          path: load-test-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Collect logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f ci-override.yml ps -a > system-ps.txt 2>&1 || true
          docker compose -f docker-compose.yml -f ci-override.yml logs --no-color --tail 300 > system-logs.txt 2>&1 || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: system-smoke-logs
          path: |
            system-ps.txt
            system-logs.txt
          retention-days: 14

      - name: Stop system and remove deploy key
        if: always()
        run: |
          docker compose -f docker-compose.yml -f ci-override.yml down -v || true
          rm -f ~/.ssh/id_ed25519

  publish:
    name: Publish images with version tags
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [prepare, system-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Images are already built and tested (sha-* tag).
      # Only version tags are added here, without rebuilding.
      - name: Tag tested images with version and run number
        run: |
          OWNER="${{ needs.prepare.outputs.owner }}"
          SRC_TAG="sha-${{ needs.prepare.outputs.short_sha }}"
          VERSION="${{ needs.prepare.outputs.version }}"
          RUN="${{ needs.prepare.outputs.run_number }}"
          for s in service-registry config-server api-gateway auth-service incident-service \
                   data-ingestion-service ai-service decision-service reporting-service \
                   notification-service frontend; do
            SRC="ghcr.io/${OWNER}/${s}:${SRC_TAG}"
            docker buildx imagetools create \
              -t "ghcr.io/${OWNER}/${s}:${VERSION}-run${RUN}" \
              -t "ghcr.io/${OWNER}/${s}:latest" \
              "$SRC"
          done

  # ---------------------------------------------------------------
  # Sonarqube
  # ---------------------------------------------------------------
  sonarqube-scan:
    name: SonarQube Scan
    needs: [ backend, ai, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Preparation
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: SQ Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Perform Quality Gate check
        uses: sonarsource/sonarqube-quality-gate-action@master
        with:
          pollingTimeoutSec: 300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Single, stable status check for branch protection ("CI result"). Component jobs skipped by the
  # path filter count as success; any failed or cancelled job fails this check and blocks the merge.
  ci-result:
    name: CI result
    needs: [ changes, backend, ai, frontend, secret-scan, dockerfile-lint, supply-chain, sonarqube-scan ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "::error::At least one CI job did not succeed"
              exit 1
            fi
          done
