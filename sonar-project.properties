sonar.projectKey=Yehor-Kovalenko_CityFailurePredictor
sonar.organization=citydisruptors

sonar.projectName=CityFailurePredictor
sonar.projectVersion=1.0


sonar.sources=frontend,services,AI

sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.coverage.jacoco.xmlReportPaths=services/*/target/site/jacoco/jacoco.xml
sonar.python.coverage.reportPaths=AI/test-results/coverage.xml

sonar.exclusions=\
**/node_modules/**,\
**/dist/**,\
**/build/**,\
**/coverage/**,\
**/.github/**,\

sonar.coverage.exclusions=\
**/*.test.ts,\
**/*.test.tsx,\
**/*.spec.ts,\
**/*.spec.tsx,\
**/generated/**

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8